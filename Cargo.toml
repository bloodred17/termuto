[package]
name = "termuto"
version = "0.2.0"
edition = "2024"
# Let-chains in `source::finish` need 1.88; `is_multiple_of` in the TUI needs 1.87.
rust-version = "1.88"
description = "Browse and play anime from the terminal, live from the Tenrai API or a local catalog"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bloodred17/termuto"
homepage = "https://github.com/bloodred17/termuto"
keywords = ["anime", "tui", "cli", "ratatui", "terminal"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/tests", "/target"]

[[bin]]
name = "termuto"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1"
async-trait = "0.1.91"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
deeb = "0.0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ratatui = "0.29"
# Default features pull in chafa, which wants pkg-config and a system library at
# build time; the protocols this needs are all built in.
ratatui-image = { version = "9", default-features = false, features = [
    "crossterm",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"
