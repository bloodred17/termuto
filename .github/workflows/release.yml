name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.1.0"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fail the release before any binaries exist if the tag and Cargo.toml
  # disagree about the version.
  verify:
    name: verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          manifest="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$version" != "$manifest" ]; then
            echo "::error::tag $tag implies version $version but Cargo.toml says $manifest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on 22.04 so the glibc baseline stays at 2.35 rather than
          # whatever ubuntu-latest happens to ship.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="termuto-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          staging="dist/$name"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/termuto" "$staging/"
          cp README.md LICENSE "$staging/"
          cp catalog.json "$staging/catalog.example.json"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "artifact=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: dist/*.tar.gz
          retention-days: 7

  release:
    name: publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum *.tar.gz | tee SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp install.sh artifacts/install.sh
          gh release create "${{ needs.verify.outputs.tag }}" \
            --title "termuto ${{ needs.verify.outputs.version }}" \
            --generate-notes \
            --verify-tag \
            artifacts/*.tar.gz artifacts/SHA256SUMS artifacts/install.sh

  homebrew:
    name: update homebrew tap
    needs: [verify, release]
    runs-on: ubuntu-latest
    # The tap lives in another repository, so GITHUB_TOKEN cannot push to it.
    # Skips cleanly instead of failing the release when the secret is absent.
    if: ${{ !contains(needs.verify.outputs.version, '-') }}
    steps:
      - name: Check for tap token
        id: gate
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping tap update"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          repository: bloodred17/homebrew-termuto
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render formula
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern 'SHA256SUMS' --dir sums
          sum_for() { grep " termuto-${VERSION}-$1.tar.gz\$" sums/SHA256SUMS | cut -d' ' -f1; }
          base="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          mkdir -p tap/Formula
          cat > tap/Formula/termuto.rb <<FORMULA
          # This file is generated by the termuto release workflow. Do not edit.
          class Termuto < Formula
            desc "Browse and play anime from the terminal"
            homepage "https://github.com/${{ github.repository }}"
            version "${VERSION}"
            license "MIT"

            def caveats
              "Playback shells out to a video player: run 'brew install mpv', or point termuto at another player with --player."
            end

            on_macos do
              on_arm do
                url "${base}/termuto-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "$(sum_for aarch64-apple-darwin)"
              end
              on_intel do
                url "${base}/termuto-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "$(sum_for x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/termuto-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sum_for aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "${base}/termuto-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sum_for x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "termuto"
            end

            test do
              assert_match "termuto", shell_output("#{bin}/termuto --version")
            end
          end
          FORMULA

      - name: Commit
        if: steps.gate.outputs.ok == 'true'
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/termuto.rb
          git diff --staged --quiet && exit 0
          git commit -m "termuto ${{ needs.verify.outputs.version }}"
          git push
